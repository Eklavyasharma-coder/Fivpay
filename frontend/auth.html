<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FivPay - Secure Financial Authentication</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .auth-canvas {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 10% 15%, rgba(13, 148, 136, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 90% 85%, rgba(15, 23, 42, 0.4) 0%, transparent 40%),
                  var(--bg-app);
    }
    .auth-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: var(--shadow-elevated);
    }
    .auth-tabs-bar {
      display: flex;
      background: var(--bg-surface-elevated);
      border-radius: var(--radius-sm);
      padding: 0.25rem;
      margin: 1.5rem 0;
      border: 1px solid var(--border-subtle);
    }
    .auth-tab-btn {
      flex: 1;
      padding: 0.55rem;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: all var(--speed-fast);
      font-family: inherit;
    }
    .auth-tab-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-subtle);
    }
    .demo-persona-panel {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-top: 1.5rem;
    }
    .persona-btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body class="auth-canvas">
  <div id="toast-container"></div>

  <div class="auth-box">
    <!-- Top Branding & Theme Toggle -->
    <div class="flex items-center justify-between">
      <div class="brand-lockup">
        <div class="brand-emblem">5</div>
        <span>FivPay</span>
      </div>
      <button class="btn btn-secondary btn-icon" id="btn-auth-theme" style="width: 32px; height: 32px;" title="Toggle Theme">
        <span id="auth-theme-icon-wrap">
          <svg class="icon-svg sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </span>
      </button>
    </div>

    <div style="margin-top: 1.25rem;">
      <h2 id="auth-headline" style="font-weight: 700; font-size: 1.4rem;">Sign in to FivPay</h2>
      <p id="auth-sub" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">
        Multi-role corporate banking and instant peer settlement.
      </p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs-bar">
      <button class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
      <button class="auth-tab-btn" id="tab-signup" onclick="switchAuthTab('signup')">Create Account</button>
    </div>

    <!-- SIGN IN FORM -->
    <form id="form-auth-login">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" value="alex.mercer@fivpay.com" required>
      </div>

      <div class="form-group">
        <div class="flex items-center justify-between">
          <label class="form-label" for="login-pwd">Password</label>
          <a href="#" style="font-size: 0.775rem;" onclick="alert('Demo notice: All demo accounts use password: demo1234')">Forgot password?</a>
        </div>
        <input type="password" id="login-pwd" class="form-control" placeholder="••••••••" value="demo1234" required>
      </div>

      <button type="submit" class="btn btn-primary w-full" id="btn-login-submit" style="padding: 0.75rem; margin-top: 0.5rem;">
        Authorize & Sign In →
      </button>
    </form>

    <!-- SIGN UP FORM -->
    <form id="form-auth-signup" class="hidden">
      <div class="form-group">
        <label class="form-label" for="signup-name">Full Legal Name</label>
        <input type="text" id="signup-name" class="form-control" placeholder="e.g. Jordan Hayes" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-email">Work or Personal Email</label>
        <input type="email" id="signup-email" class="form-control" placeholder="jordan@fintech.io" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-role">Role Workspace Type</label>
        <select id="signup-role" class="form-control">
          <option value="user">Personal Retail Client (User)</option>
          <option value="staff">Corporate Operations (Staff)</option>
          <option value="admin">System Administrator (Admin)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-pwd">Create Secure Password</label>
        <input type="password" id="signup-pwd" class="form-control" placeholder="Min. 8 characters" required>
      </div>

      <button type="submit" class="btn btn-primary w-full" style="padding: 0.75rem; margin-top: 0.5rem;">
        Create Account →
      </button>
    </form>

    <!-- DEMO PERSONA SELECTOR -->
    <div class="demo-persona-panel">
      <div class="flex items-center justify-between">
        <span style="font-size: 0.725rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px;">
          1-Click Demo Personas
        </span>
        <span class="badge badge-emerald" style="font-size: 0.65rem;">Live JWT Auth</span>
      </div>
      <div class="persona-btn-grid">
        <button type="button" class="btn btn-secondary btn-sm" onclick="quickLogin('alex.mercer@fivpay.com')">
          User
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="quickLogin('sarah.compliance@fivpay.com')">
          Staff
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="quickLogin('marcus.admin@fivpay.com')">
          Admin
        </button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function switchAuthTab(tab) {
      const loginForm = document.getElementById('form-auth-login');
      const signupForm = document.getElementById('form-auth-signup');
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const title = document.getElementById('auth-headline');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        title.textContent = 'Sign in to FivPay';
      } else {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        tabLogin.classList.remove('active');
        tabSignup.classList.add('active');
        title.textContent = 'Register New FivPay Account';
      }
    }

    async function quickLogin(email) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-pwd').value = 'demo1234';
      await handleLogin(email, 'demo1234');
    }

    async function handleLogin(email, pwd) {
      const btn = document.getElementById('btn-login-submit');
      if (btn) btn.innerHTML = 'Verifying credentials...';

      // 1. Try real Flask API
      const res = await window.fivpayApi.login(email, pwd);
      if (res.success) {
        window.location.href = 'index.html';
      } else {
        // Fallback to local session
        let role = 'user';
        if (email.includes('compliance') || email.includes('staff')) role = 'staff';
        if (email.includes('admin')) role = 'admin';
        window.authManager.login(email, pwd, role);
        window.location.href = 'index.html';
      }
    }

    document.getElementById('form-auth-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pwd = document.getElementById('login-pwd').value;
      await handleLogin(email, pwd);
    });

    document.getElementById('form-auth-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const pwd = document.getElementById('signup-pwd').value;
      const role = document.getElementById('signup-role')?.value || 'user';

      const res = await window.fivpayApi.register(name, email, pwd, role);
      if (res.success) {
        window.location.href = 'index.html';
      } else {
        window.authManager.signup(name, email, pwd, role);
        window.location.href = 'index.html';
      }
    });

    // Theme Toggle in Auth
    const themeBtn = document.getElementById('btn-auth-theme');
    themeBtn?.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('fivpay_theme', next);
      document.getElementById('auth-theme-icon-wrap').innerHTML = window.getSvg(next === 'light' ? 'moon' : 'sun');
    });
  </script>
</body>
</html>
